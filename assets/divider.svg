<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Left Line -->
  <line
      x1="40"
      y1="20"
      x2="520"
      y2="20"
      stroke="url(#line)"
      stroke-width="2"
      filter="url(#glow)"
  />

  <!-- Center Circle -->
  <circle
      cx="600"
      cy="20"
      r="5"
      fill="#38BDF8"
      filter="url(#glow)"
  />

  <!-- Outer Ring -->
  <circle
      cx="600"
      cy="20"
      r="10"
      fill="none"
      stroke="#38BDF8"
      stroke-width="1"
      opacity="0.6"
  />

  <!-- Right Line -->
  <line
      x1="680"
      y1="20"
      x2="1160"
      y2="20"
      stroke="url(#line)"
      stroke-width="2"
      filter="url(#glow)"
  />

</svg>
