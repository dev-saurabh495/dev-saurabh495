<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="sp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Left Line -->
  <line
      x1="40"
      y1="30"
      x2="500"
      y2="30"
      stroke="url(#line)"
      stroke-width="2"
      filter="url(#glow)"
  />

  <!-- SP Box -->
  <rect
      x="510"
      y="10"
      width="180"
      height="40"
      rx="20"
      fill="#08111F"
      stroke="#38BDF8"
      stroke-width="1.5"
      filter="url(#glow)"
  />

  <!-- Left Accent -->
  <circle cx="525" cy="30" r="3" fill="#38BDF8"/>

  <!-- Right Accent -->
  <circle cx="675" cy="30" r="3" fill="#38BDF8"/>

  <!-- SP -->
  <text
      x="600"
      y="37"
      text-anchor="middle"
      font-size="20"
      font-weight="700"
      font-family="JetBrains Mono, Segoe UI, Arial"
      fill="url(#sp)"
      letter-spacing="6">

      SP

  </text>

  <!-- Right Line -->
  <line
      x1="700"
      y1="30"
      x2="1160"
      y2="30"
      stroke="url(#line)"
      stroke-width="2"
      filter="url(#glow)"
  />

</svg>
